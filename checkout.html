<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORGE — Checkout</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html">FORGE</a><a class="header-cta" href="cart.html">Back to Cart</a></header><main class="section checkout-page"><p class="eyebrow">CHECKOUT</p><h1>COMPLETE YOUR <span>ORDER.</span></h1><div class="checkout-grid"><form id="checkout-form" class="checkout-form"><label>Full name<input required name="name" autocomplete="name"></label><label>Email<input required type="email" name="email" autocomplete="email"></label><label>Phone<input required type="tel" name="phone" autocomplete="tel"></label><label>Shipping address<textarea required name="address" rows="4"></textarea></label><label>Payment method<select name="payment"><option>Cash on Delivery</option><option>GCash</option><option>Card (ready for gateway integration)</option></select></label><button class="button button-primary" type="submit">Place Order</button></form><aside class="checkout-summary"><p class="eyebrow">ORDER SUMMARY</p><div id="checkout-items"></div><hr><strong id="checkout-total">₱0</strong></aside></div></main><script src="checkout.js"></script></body></html>
